services:
  - type: web
    name: brand-risk-radar-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FRONTEND_URL
        sync: false
